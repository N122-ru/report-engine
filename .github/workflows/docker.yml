name: Build Docker release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "Tag and VERSION do not match"; exit 1; }

      - name: Build Docker image
        run: docker build -t report-engine:v${VERSION} .

      - name: Start Docker container
        run: docker run -d --name report-engine-smoke -p 8000:8000 report-engine:v${VERSION}

      - name: Wait for health
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs report-engine-smoke || true
          exit 1

      - name: Check API endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health > /dev/null
          curl --fail --silent --show-error http://localhost:8000/api/version > /dev/null

      - name: Stop And Remove Docker Container
        if: always()
        run: docker rm --force report-engine-smoke || true

      - name: Create Docker archive
        run: docker save report-engine:v${VERSION} | gzip > report-engine-docker-image-v${VERSION}-linux-x64.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-engine-docker-image-v${{ env.VERSION }}-linux-x64
          path: report-engine-docker-image-v${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

      - name: Attach Docker archive to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: report-engine-docker-image-v${{ env.VERSION }}-linux-x64.tar.gz
