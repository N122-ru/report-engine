services:
  report-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: report-engine
    ports:
      - "8000:8000"
    environment:
      FORWARDED_ALLOW_IPS: "*"
      # Unset update variables use the backend's built-in repository default.
      REPORT_ENGINE_UPDATE_REPOSITORY:
      REPORT_ENGINE_UPDATE_URL:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
